<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
  <title id="title">Namib fairy circles concept illustration</title>
  <desc id="description">An original stylized illustration of circular bare patches in a dry grassland, not a satellite or field photograph.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d855b"/>
      <stop offset="1" stop-color="#413e32"/>
    </linearGradient>
    <radialGradient id="patch">
      <stop offset="0" stop-color="#c1a875"/>
      <stop offset=".75" stop-color="#aa9465"/>
      <stop offset="1" stop-color="#6f704b"/>
    </radialGradient>
    <pattern id="grass" width="72" height="66" patternUnits="userSpaceOnUse">
      <path d="M8 62l7-21m4 21l-1-25m24 25l8-17m5 17l-2-29m14 29l8-20" stroke="#c1c58a" stroke-width="2" opacity=".52"/>
    </pattern>
  </defs>
  <rect width="900" height="560" fill="url(#ground)"/>
