    <ellipse cx="160" cy="277" rx="57" ry="39"/>
    <ellipse cx="330" cy="244" rx="42" ry="30"/>
    <ellipse cx="505" cy="286" rx="64" ry="42"/>
    <ellipse cx="714" cy="240" rx="48" ry="34"/>
    <ellipse cx="252" cy="425" rx="69" ry="43"/>
    <ellipse cx="438" cy="438" rx="43" ry="30"/>
    <ellipse cx="653" cy="419" rx="66" ry="41"/>
    <ellipse cx="830" cy="380" rx="45" ry="31"/>
  </g>
  <text x="54" y="514" fill="#f1e7c7" font-family="system-ui, sans-serif" font-size="18" letter-spacing="2">CONCEPT ILLUSTRATION · NOT A FIELD IMAGE</text>
</svg>
